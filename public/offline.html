<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b2b67" />
    <title>RocketRota is offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      main {
        width: min(28rem, calc(100% - 2rem));
        text-align: center;
      }
      img {
        width: 7rem;
        height: auto;
      }
      h1 {
        margin: 1.5rem 0 0.5rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: #64748b;
      }
      button {
        border: 0;
        border-radius: 0.5rem;
        padding: 0.7rem 1rem;
        background: #0b2b67;
        color: white;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/rocketrota-logo.png" alt="RocketRota" />
      <h1>You are offline</h1>
      <p>Reconnect to load your latest rota and workspace updates.</p>
      <button type="button" onclick="window.location.reload()">
        Try again
      </button>
    </main>
  </body>
</html>
