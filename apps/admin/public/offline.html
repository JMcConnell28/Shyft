<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Admin is offline</title>
    <style>
      body { box-sizing: border-box; min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 1.5rem; background: #f8fafc; color: #0f172a; font: 16px system-ui, sans-serif; }
      main { max-width: 24rem; text-align: center; }
      img { width: 4rem; height: 4rem; border-radius: 1rem; }
      h1 { margin: 1rem 0 .5rem; font-size: 1.5rem; }
      p { color: #475569; line-height: 1.5; }
      a { display: inline-block; margin-top: .75rem; border-radius: .5rem; padding: .65rem 1rem; background: #0f172a; color: white; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" alt="" />
      <h1>Admin is offline</h1>
      <p>Reconnect to the internet to access the admin console.</p>
      <a href="/dashboard">Try again</a>
    </main>
  </body>
</html>
